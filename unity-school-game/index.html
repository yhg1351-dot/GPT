function home(){const has=state.history.length>0;$('#app').innerHTML=`<section class="hero"><div><p class="eyebrow">6학년 도덕 · 개인 선택형 이야기</p><h1>우리의<br><em>첫 번째 선택</em></h1><p class="intro">학교는 하나가 되었다.<br>우리 마음도, 하나가 되었을까?</p><div class="meta"><span><b>혼자</b> 진행</span><span><b>12~15분</b>의 이야기</span><span><b>다음 장</b>은 아직</span></div><div class="actions"><button class="primary" id="start">${has?'이어서 시작하기':'이야기 시작하기'} <span>→</span></button><button class="secondary" id="how">수업 진행 안내</button></div><p class="entryNote">PPT를 함께 읽은 뒤, 이제는 네가 선택할 차례.<br>게임 속 대사와 결과는 수업을 위해 새로 만든 이야기입니다.</p></div><div class="dossier" aria-label="선거 알림"><p class="eyebrow">학생회장 선거 · 첫날</p><h2>도착한 소식</h2><div class="notice"><span class="stamp">후보 등록</span><h3>서재원 · 남보배 · 김대성</h3><p>이름은 알게 되었다.<br>그들의 생각도 알고 있을까?</p></div><div class="message"><div class="from">복도에서 들려온 목소리</div>“우리의 이야기는<br>누가 들어 주지?”</div><div class="unread"><span>지금부터, 네가 이야기 속 친구다.</span><b>선택 대기</b></div></div></section>`;bind('start',()=>{if(has){state.round=Math.min(state.history.length-1,2);setPage(state.history.length===3?'end':'result')}else setPage('setup')});bind('how',guide)}
function setup(){state.mode='solo';$('#app').innerHTML=`<section class="setup"><p class="eyebrow">개인 플레이 · 12~15분</p><h1>너도 이 학교의 학생이다</h1><p class="lead">회장 후보를 고르기 전에, 친구들의 말을 어떻게 듣고 행동할지 선택해 보자. 네가 누구에게 먼저 다가가느냐에 따라 듣게 되는 말이 달라진다.</p><div class="rules"><div><b>01 · 네 마음대로 고르기</b><p>주어진 상황에서 네가 하고 싶은 행동을 고른다. 친구와 같은 답을 고를 필요는 없다.</p></div><div><b>02 · 결과를 읽고 생각하기</b><p>친구의 반응을 살피고, 새로 알게 된 점과 남은 걱정을 생각한다.</p></div><div><b>03 · 나만의 질문 남기기</b><p>다음 읽기에서 확인하고 싶은 질문을 적고 이야기를 마친다.</p></div></div><label class="switch"><input type="checkbox" id="readAll" ${state.readAll?'checked':''}>PPT 65쪽까지 모두 읽었어요. <span class="small">이미 읽었다면 ‘다른 가능성’으로 참여합니다.</span></label>${buttons()}<p class="small">진행과 메모는 지금 사용하는 기기에 자동 저장됩니다. 이름이나 로그인은 필요 없습니다. 공용 기기라면 끝난 뒤 기록을 저장하고 ‘새로 시작’을 누르세요.</p></section>`;$('#readAll').onchange=e=>{state.readAll=e.target.checked;save()};bind('go',()=>{state.round=0;setPage('scene')})}
function rail(){const names=['먼저 다가갈 사람','퍼져 가는 말','내일을 위한 행동'];return `<aside class="rail"><div class="chapter">첫 번째 이야기<strong>0${state.round+1}<span style="font-size:16px;color:var(--muted)"> / 03</span></strong></div><ol class="steps">${names.map((n,i)=>`<li class="${state.round===i?'current':''}"><span>${i<state.history.length?'기록 완료':'선택 '+(i+1)}</span>${n}</li>`).join('')}</ol>${state.history.length?`<div class="clueCard"><small>앞에서 얻은<br>단서</small><p>${esc(state.history[Math.min(state.history.length-1,state.round-1<0?0:state.round-1)].clue)}</p></div>`:'<div class="clueCard"><small>오늘의 미션</small><p>출신만으로 마음을 짐작하지 않고, 친구의 생각을 알아보기.</p></div>'}</aside>`}
function bridge(){if(state.round===1){return ['철민의 걱정을 들었지만, 이 메시지가 철민의 생각과 같은지는 알 수 없다.','보배에게 대화를 제안했다. 지금 이 대화방에도 서로 말할 기회가 필요할까?','게시판에서 확인한 것은 후보 등록 소식뿐이었다. 이 메시지에는 무엇이 더해졌을까?'][state.history[0]?.choice??0]}if(state.round===2){return ['공개적으로 근거를 물었던 만큼, 이제 실제로 답을 찾을 행동이 필요하다.','두 친구에게 서로 다른 답을 들었다. 아직 듣지 못한 목소리도 남아 있다.','추측을 공유하지 않고 질문을 적었다. 이제 그 질문을 행동으로 옮길 시간이다.'][state.history[1]?.choice??0]}return ''}

'처음에 게시판에서 사실을 확인했던 너는, 이번에도 들은 말과 짐작을 나누어 적었다.'
][a]+' '+['대화방에서 시작한 질문이, 이제 실제 대화로 이어진다.','앞서 만난 두 친구의 답과 새로운 목소리를 함께 비교해 본다.','노트 속 질문에 답을 찾는 첫 행동을 시작했다.'][b]}
function result(){const h=state.history[state.round];if(!h){setPage('scene');return}const o=rounds[state.round].options[h.choice];$('#app').innerHTML=`<div class="roundLayout">${rail()}<section class="stage"><div class="stageHead"><span class="place">선택 ${state.round+1}의 결과</span><span class="small">가능한 반응 중 하나입니다</span></div><h1>${o.result}</h1><p class="small">너의 선택 · ${'ABC'[h.choice]} ${o.title}</p><div class="resultBox"><p class="resultTitle">그 뒤에 일어난 일</p><p>${o.response}</p>${extraResult()?`<p class="branchLine">${extraResult()}</p>`:''}<div class="twoCol"><div class="insight"><h3>새롭게 알게 된 점</h3><p>${o.gain}</p></div><div class="insight cost"><h3>아직 남은 과제</h3><p>${o.cost}</p></div></div></div><div class="thinking"><span class="thoughtLabel">잠깐, 스스로 생각하기</span>${o.ask}</div><div class="actions"><button id="next" class="primary">${state.round===2?'방과 후 메시지 열기':'다음 장면으로'} →</button><button id="peek" class="quiet">내 선택 이유 보기</button></div></section></div>`;bind('next',()=>{if(state.round===2)setPage('end');else{state.round++;setPage('scene')}});bind('peek',notes)}
function finalLetter(){const first=state.history[0]?.choice??0,last=state.history[2]?.choice??0;const names=['강철민','남보배','리수연'];const openings=['“아까 내 얘기를 들어 준 거, 기억하고 있어. 그런데 내 마음도 한마디로 다 설명하긴 어렵더라.','“오늘 같이 방법을 찾아줘서 고마워. 친구를 불러 모으는 일보다 그 마음을 듣는 일이 더 어렵네.','“게시판 앞에서 생각하던 네 모습을 봤어. 이름 아래에 적히지 않은 이야기도 많을 것 같아.'];const endings=['네가 만난 그 친구에게 나도 물어보고 싶어. 우리가 놓친 말은 또 없을까?”','내일 그 질문함을 함께 열어 보고 싶어. 어떤 바람이 들어 있을까?”','네가 만든 질문에 후보들은 뭐라고 답할까? 말과 행동이 같을지도 궁금해.”'];return {name:names[first],text:openings[first]+' '+endings[last]}}
function ending(){const l=finalLetter();$('#app').innerHTML=`<section class="ending"><div class="stageHead"><p class="eyebrow">첫 번째 이야기 · 마지막 알림</p><span class="resultCode">선택 기록 ${state.history.map(h=>'ABC'[h.choice]).join(' · ')}</span></div><h1>답장을 쓰기 전에,<br>다음 장을 기다린다</h1><p class="lead">세 번의 선택으로 세상의 모든 마음을 알 수는 없었다.<br>하지만 이제, 그냥 지나치기 어려운 말이 생겼다.</p><div class="letterPaper"><p class="eyebrow">${l.name}에게서 온 메시지 · 게임 속 가상 대사</p><p>${l.text}</p><div class="signature">너의 첫 선택과 마지막 행동에 따라 달라진 편지</div><div class="sealed"><span class="eyebrow" style="margin:0">아직 열지 않은 다음 이야기</span><p>회장이 되고 싶은 마음. 무시당하고 싶지 않은 마음.<br>이 마음들이 부딪히면, 친구들은 무엇을 선택할까?</p></div></div><div class="reflection"><h2>다음 장에서 확인할 나의 질문</h2><p class="small">${state.readAll?'이미 읽은 장면을 떠올려도 좋아요. 다음 읽기에서 더 살피고 싶은 말과 행동을 적으세요.':'예측은 틀려도 괜찮아요. 함께 읽은 장면을 근거로 생각해 보세요.'}</p><label for="prediction">1. 앞으로 누가 어떤 선택을 할까? 그렇게 예상한 장면은?</label><textarea id="prediction" maxlength="500" placeholder="나는 ______가 ______할 것 같다. PPT에서 ______했기 때문이다.">${esc(state.prediction)}</textarea><label for="question">2. 다음 읽기에서 꼭 확인하고 싶은 것 한 가지</label><textarea id="question" maxlength="300" placeholder="예: 철민은 자신과 생각이 다른 친구의 말도 들어 줄까?">${esc(state.question)}</textarea><p class="hint">기록은 이 기기에만 남습니다. 제출할 때는 ‘선택 기록 저장’으로 내려받거나 종이에 적으세요.</p></div><div class="actions"><button id="download" class="primary">선택 기록 저장 ↓</button><button id="print" class="secondary">내 기록 인쇄</button><button id="review" class="quiet">선택 노트</button><button id="restart" class="quiet">새로 시작</button></div><div class="endPreview"><strong>다음 시간, 같은 질문을 가지고 다시 만나자.</strong><br><span class="small">게임 속 결과와 원자료의 실제 전개는 다를 수 있습니다. 원자료의 다음 장면을 읽으며 비교하세요.</span></div></section>`;for(const id of ['prediction','question'])$('#'+id).oninput=e=>{state[id]=e.target.value;save()};bind('download',download);bind('print',()=>printRecord(false));bind('review',notes);bind('restart',restart)}
function panel(html,tag){$('#panelContent').innerHTML=html;$('#panelTag').textContent=tag||'함께 읽기 01';if(!$('#panel').open)$('#panel').showModal();$('#panel').scrollTop=0}
function cast(){panel(`<h2>이야기 속 친구들</h2><p>같은 출신이라도 서로 다른 생각을 지닌 한 사람이다. 지금 아는 정보만으로 마음을 모두 짐작할 수는 없다.</p><div class="castGrid">${characters.map(c=>`<div class="cast"><strong>${c[0]}</strong><small>${c[1]}</small><p>${c[2]}</p></div>`).join('')}</div><p class="sourceNote">인물 소개는 제공된 PPT 3~8쪽을 요약했습니다. 게임 속 대사·행동·메시지는 수업용 창작입니다. 인물의 말은 그 인물의 관점이며, 남쪽 또는 북쪽 전체 학생을 대표하지 않습니다.</p>`,'인물 수첩 · 도입부 기준')}
function notes(){panel(`<h2>나의 선택 노트</h2>${state.history.length?state.history.map((h,i)=>`<article class="noteEntry"><small>선택 ${i+1} · ${rounds[i].title}</small><h3>${'ABC'[h.choice]}. ${esc(h.title)}</h3><p><strong>선택한 까닭</strong><br>${esc(h.reason||'말로 나눈 이유를 떠올려 보세요.')}</p><p><strong>남은 단서</strong><br>${esc(h.clue)}</p></article>`).join(''):'<p>아직 선택하기 전이에요. 이야기를 시작하면 여기 기록됩니다.</p>'}<p class="sourceNote">점수나 등급은 없습니다. 무엇을 지키려 했는지, 누구의 목소리를 더 들어야 할지 살펴보세요.</p>`,'선택 기록 · 이 기기에만 저장')}
function guide(){panel(`<h2>학생 개인별 웹 게임</h2><p><strong>진행 방법:</strong> 학생에게 이 웹페이지 주소를 배부합니다. 학생은 로그인이나 설치 없이 접속해서 각자의 속도로 진행합니다. 다른 학생의 선택이 내 화면에 영향을 주지 않습니다.</p><p><strong>학습 목표:</strong> 인물의 걱정과 바람을 헤아리고, 확인한 사실과 추측을 구분하며, 서로 존중하는 행동의 이유를 설명합니다.</p><table class="guideTable"><thead><tr><th>시간</th><th>활동</th><th>진행</th></tr></thead><tbody><tr><td>0~18분</td><td>PPT 함께 읽기</td><td>후보 등록 소식이 알려지는 33~37쪽 부근에서 멈춥니다.</td></tr><tr><td>18~20분</td><td>개인 기기로 접속</td><td>주소를 열고 ‘이야기 시작하기’를 누릅니다.</td></tr><tr><td>20~32분</td><td>개인별 세 장면 진행</td><td>상황 읽기 → 개인 선택 → 결과 읽기. 먼저 끝난 학생은 자신의 질문을 다듬습니다.</td></tr><tr><td>32~37분</td><td>내 예측과 질문 기록</td><td>마지막 화면에 다음 읽기에서 확인할 질문과 근거를 적습니다.</td></tr><tr><td>37~40분</td><td>원하는 학생의 질문 공유</td><td>인물에 대한 서로 다른 질문을 들어 봅니다. 다음 전개는 공개하지 않습니다.</td></tr></tbody></table><h3>읽기 지점에 따라</h3><p><strong>권장:</strong> PPT 1~37쪽 부근까지 읽고 게임을 시작합니다. 38쪽 활동은 게임 뒤 정리 질문으로 활용하고, 39쪽 이후는 다음 읽기로 남겨 둡니다.<br><strong>전체를 읽었다면:</strong> 게임 입장 화면의 ‘모두 읽었어요’를 선택합니다. 후보 등록 직후로 돌아간 다른 가능성으로 안내하고, 원자료의 인물과 자신의 선택을 비교합니다.</p><h3>교사가 짚을 지점</h3><div class="checkpoint"><span>01</span><div>선택을 점수나 등급으로 평가하지 않습니다. 선택 이유, 사실과 추측의 구별, 아직 듣지 못한 목소리를 살핍니다.</div></div><div class="checkpoint"><span>02</span><div>학생을 남쪽 편·북쪽 편으로 나누지 않습니다. 같은 출신이라도 생각은 다를 수 있습니다. 출신을 이유로 비하하거나 자격을 제한하는 행동은 존중과 공정의 관점에서 짚습니다.</div></div><div class="checkpoint"><span>03</span><div>인물의 상처는 행동을 이해하는 단서이며 차별을 정당화하는 이유는 아닙니다. 게임의 반응은 가능한 결과 중 하나이며 원자료의 실제 전개와 다를 수 있습니다.</div></div><h3>진행과 기록</h3><p>각 학생의 선택·메모는 해당 기기의 브라우저에만 자동 저장됩니다. 새로고침 후 이어 할 수 있습니다. 마지막 화면에서 선택 기록을 내려받거나 인쇄할 수 있습니다. 교사에게 답안을 자동 전송하거나 여러 기기 사이에 동기화하는 기능은 없습니다. 공용 기기에서는 개인 기록 저장 후 ‘새로 시작’을 누르세요.</p><h3>다음 차시 첫 3분</h3><p>지난 시간 자신의 질문을 다시 확인합니다. 이어 읽으며 질문과 관련된 말·행동에 표시하고, 예상과 같거나 달랐던 점을 나눕니다.</p><div class="actions"><button class="primary" id="worksheet">개인 활동지 인쇄</button><button class="secondary" id="guideReset">이 기기의 진행 초기화</button></div><p class="sourceNote">기반 자료: 사용자 제공 「통일한국 제1고등학교 (1) (1).pptx」, 65쪽. 인물 3~8쪽, 학교 설정 11·14쪽, 후보 등록 30~34쪽 참고. 게임의 장면·대사·결과는 수업용 창작이며 작품의 다음 전개를 제시하지 않습니다. 원자료의 통일 방식이나 인물의 견해는 작품의 설정입니다.</p>`,'선생님용 · 개인 기기로 40분 수업');bind('worksheet',()=>printRecord(true));bind('guideReset',restart)}
function restart(){panel('<h2>새로 시작할까요?</h2><p>이 기기의 선택 기록과 메모가 지워집니다. 필요한 기록은 먼저 저장해 주세요.</p><div class="actions"><button id="resetYes" class="primary">기록 지우고 처음으로</button><button id="resetNo" class="secondary">계속하기</button></div>','진행 초기화');bind('resetYes',()=>{state=fresh();save();$('#panel').close();setPage('home')});bind('resetNo',()=>$('#panel').close())}
function download(){const lines=['통일한국 제1고등학교 | 첫 번째 선택','게임 속 상황·결과는 수업용 창작입니다.','선택 기록: '+state.history.map(h=>'ABC'[h.choice]).join('-'),''];state.history.forEach((h,i)=>lines.push(`${i+1}. ${h.title}`,'선택한 까닭: '+(h.reason||'(말로 나눔)'),'남은 단서: '+h.clue,''));lines.push('앞으로의 예측과 근거: '+(state.prediction||'(미작성)'),'다음 읽기에서 확인할 질문: '+(state.question||'(미작성)'));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='통일학교_나의선택기록.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('선택 기록 파일을 내려받습니다.')}
function printRecord(blank){$('#printArea').innerHTML=`<p>6학년 도덕 · 함께 읽기 01</p><h1>우리의 첫 번째 선택</h1><p>이름: ____________________ 날짜: ____________</p>${blank?'<p>혼자 선택한 이유를 떠올리고, 결과를 본 뒤 남은 질문을 적습니다.</p>'+rounds.map((r,i)=>`<div class="printEntry"><h2>${i+1}. ${r.title}</h2><p>선택: A / B / C　　지키고 싶었던 것:</p><div class="line"></div><p>새로 알게 된 점 또는 남은 걱정:</p><div class="line"></div></div>`).join(''):state.history.map((h,i)=>`<div class="printEntry"><h2>${i+1}. ${esc(h.title)}</h2><p>이유: ${esc(h.reason||'(말로 나눔)')}<br>단서: ${esc(h.clue)}</p></div>`).join('')}<h2>다음 장에서 확인할 것</h2><p>누가 어떤 선택을 할까? 그렇게 예상한 장면은?</p>${blank?'<div class="space"></div>':`<p>${esc(state.prediction||'(미작성)')}</p>`}<p>다음 읽기에서 꼭 확인할 질문 한 가지:</p>${blank?'<div class="space"></div>':`<p>${esc(state.question||'(미작성)')}</p>`}<p class="foot">기반: 사용자 제공 「통일한국 제1고등학교」 PPT. 게임 상황과 결과는 수업용 창작이며, 인물의 견해가 출신 집단 전체를 대표하지 않습니다.</p>`;window.print()}
bind('home',e=>{e.preventDefault();setPage('home')});bind('castBtn',cast);bind('noteBtn',notes);bind('guideBtn',guide);bind('closePanel',()=>$('#panel').close());bind('fullBtn',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('브라우저 메뉴에서 전체 화면을 선택해 주세요.')}});$('#panel').addEventListener('click',e=>{if(e.target===$('#panel')){const r=$('#panel').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#panel').close()}});render();
</script>
